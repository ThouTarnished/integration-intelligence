[project]
name = "integration-intelligence"
version = "2.0.0"
description = "Identity & risk-events integration for a fictional bank: explainable scoring, incident correlation, live dashboard and AI analyst."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
