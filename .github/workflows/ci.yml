name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned, so the Python 3.10 job keeps a supported image when ubuntu-latest moves on
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
